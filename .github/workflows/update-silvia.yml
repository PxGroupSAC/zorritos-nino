name: Actualizar semáforo SILVIA (SENAMHI)
# SENAMHI (idesep.senamhi.gob.pe y www.senamhi.gob.pe) no responde a los servidores de GitHub ni a proxies
# en la nube (comprobado el 4 nov 2026: todas las conexiones expiran). Por eso la actualización diaria corre en la
# Mac de Felipe con launchd (tools/silvia_local.sh). Este workflow queda solo para lanzarlo a mano por si cambia.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-update
  cancel-in-progress: false
jobs:
  silvia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/update_silvia.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "Sin cambios"; exit 0; fi
          git add zorritos-nino-mapa-peligro.html index.html
          git commit -m "Semáforo SILVIA actualizado ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push
